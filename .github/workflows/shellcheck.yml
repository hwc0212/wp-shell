name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax and safety checks
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y sqlite3 jq >/dev/null
          bash tests/v11-bootstrap.sh
          bash tests/v11-capacity.sh
          bash tests/v11-manual-workers.sh
          bash tests/v11-metrics-migration.sh
          bash tests/static-checks.sh
          bash tests/config-roundtrip.sh
          bash tests/render-nginx.sh
          bash tests/storage-layout.sh
          bash tests/metrics-roundtrip.sh
          bash tests/wordpress-core.sh
          bash tests/dashboard-smoke.sh
          bash tests/menu-routing.sh
          bash tests/opcache-config.sh
          bash tests/php-memory-budget.sh
          bash tests/mariadb-legacy.sh
          bash tests/imported-site-reliability.sh
          bash tests/reliability-regression.sh
          bash tests/control-plane.sh
          bash tests/cloudflare-policy.sh
          bash tests/compatibility-policies.sh

      - name: ShellCheck
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          koalaman/shellcheck:stable
          -x
          /mnt/wp-shell.sh
          /mnt/wp-shell-v11.sh
          /mnt/wp-vps-manager.sh
          /mnt/deploy-single-wordpress.sh
          /mnt/tests/static-checks.sh
          /mnt/tests/v11-bootstrap.sh
          /mnt/tests/v11-capacity.sh
          /mnt/tests/v11-manual-workers.sh
          /mnt/tests/v11-metrics-migration.sh
          /mnt/tests/v11-fpm-integration.sh
          /mnt/tests/config-roundtrip.sh
          /mnt/tests/render-nginx.sh
          /mnt/tests/storage-layout.sh
          /mnt/tests/metrics-roundtrip.sh
          /mnt/tests/wordpress-core.sh
          /mnt/tests/dashboard-smoke.sh
          /mnt/tests/menu-routing.sh
          /mnt/tests/opcache-config.sh
          /mnt/tests/php-memory-budget.sh
          /mnt/tests/mariadb-legacy.sh
          /mnt/tests/mariadb-legacy-integration.sh
          /mnt/tests/imported-site-reliability.sh
          /mnt/tests/imported-site-integration.sh
          /mnt/tests/reliability-regression.sh
          /mnt/tests/control-plane.sh
          /mnt/tests/cloudflare-policy.sh
          /mnt/tests/compatibility-policies.sh
          /mnt/tests/nginx-integration.sh
          /mnt/tests/service-config-integration.sh
          /mnt/tests/operations-integration.sh

      - name: Nginx configuration integration test
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          ubuntu:24.04
          bash -c
          'apt-get update >/dev/null &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nginx openssl php8.3-fpm curl python3 >/dev/null &&
          bash /mnt/tests/nginx-integration.sh'

      - name: Service configuration integration test
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          ubuntu:24.04
          bash -c
          'apt-get update >/dev/null &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mariadb-server redis-server php8.3-fpm php8.3-cli openssl sqlite3 jq libfcgi-bin sudo acl curl gnupg ca-certificates rsync python3 >/dev/null &&
          bash /mnt/tests/service-config-integration.sh &&
          bash /mnt/tests/operations-integration.sh'

      - name: Imported site reliability integration test
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          ubuntu:24.04
          bash -c
          'apt-get update >/dev/null &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sudo ca-certificates >/dev/null &&
          bash /mnt/tests/imported-site-integration.sh'

      - name: V11 manual capacity / real PHP-FPM integration
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          ubuntu:24.04
          bash -c
          'apt-get update >/dev/null &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php8.3-fpm ca-certificates >/dev/null &&
          bash /mnt/tests/v11-fpm-integration.sh'

  mariadb-legacy:
    name: MariaDB legacy migration / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Effective configuration and migration integration
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          ubuntu:${{ matrix.ubuntu }}
          bash -c
          'apt-get update >/dev/null &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mariadb-server ca-certificates >/dev/null &&
          bash /mnt/tests/mariadb-legacy-integration.sh'
